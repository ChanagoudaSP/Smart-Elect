{% extends "base.html" %}

{% block title %}Add Candidate{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">

    <!-- Top Breadcrumb & Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-400 font-medium mb-1">
                <a href="{{ url_for('admin.dashboard') }}" class="hover:text-emerald-500 transition">Command Center</a>
                <span>&gt;</span>
                <a href="{{ url_for('admin.manage_candidates', election_id=election.id) }}" class="hover:text-emerald-500 transition">{{ election.title }} Candidates</a>
                <span>&gt;</span>
                <span>Add Candidate</span>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Add Candidate</h1>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">Registering candidate for <strong class="text-slate-800 dark:text-slate-200">{{ election.title }}</strong></p>
        </div>

        <div class="flex items-center gap-3 self-start sm:self-auto">
            <a href="{{ url_for('admin.manage_candidates', election_id=election.id) }}" class="btn-vireo-secondary flex items-center gap-2 text-xs">
                <i class="fas fa-arrow-left text-slate-400"></i>
                <span>Back to Candidates</span>
            </a>
        </div>
    </div>

    <!-- Form Container in Vireo Card -->
    <div class="vireo-card p-6 sm:p-8">
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Candidate Full Name</label>
                <input type="text" id="name" name="name" required
                       class="w-full rounded-xl border border-slate-200 dark:border-[#1e283d] bg-white dark:bg-[#192238] px-4 py-2.5 text-xs sm:text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                       placeholder="Legal full name">
            </div>

            <div>
                <label for="party" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Political Party / Affiliation</label>
                <input type="text" id="party" name="party" required
                       class="w-full rounded-xl border border-slate-200 dark:border-[#1e283d] bg-white dark:bg-[#192238] px-4 py-2.5 text-xs sm:text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                       placeholder="e.g. Independent, Green Alliance">
            </div>

            <div>
                <label for="bio" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Biography &amp; Platform</label>
                <textarea id="bio" name="bio" rows="4" required
                          class="w-full rounded-xl border border-slate-200 dark:border-[#1e283d] bg-white dark:bg-[#192238] px-4 py-2.5 text-xs sm:text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                          placeholder="Candidate background and political manifesto summary..."></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Photo <span class="text-slate-400 font-normal lowercase">(optional)</span></label>
                <label for="photo"
                       class="flex flex-col items-center justify-center w-full h-32 rounded-2xl border-2 border-dashed border-slate-200 dark:border-[#1e283d] bg-slate-50/50 dark:bg-[#192238]/40 hover:border-emerald-500 hover:bg-emerald-500/5 cursor-pointer transition">
                    <i class="fas fa-cloud-arrow-up text-xl text-slate-400 mb-1.5"></i>
                    <span class="text-xs text-slate-500 dark:text-slate-400">Click to upload candidate headshot</span>
                    <input type="file" id="photo" name="photo" accept="image/*" class="hidden">
                </label>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-3 border-t border-slate-100 dark:border-[#1e283d]">
                <button type="submit" class="btn-vireo-primary flex-1 flex items-center justify-center gap-2 text-xs py-2.5">
                    <i class="fas fa-plus"></i>
                    <span>Add Candidate</span>
                </button>
                <a href="{{ url_for('admin.manage_candidates', election_id=election.id) }}" class="btn-vireo-secondary flex-1 text-center text-xs py-2.5">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>

<script>
document.getElementById('photo').addEventListener('change', function() {
    const label = this.closest('label');
    if (this.files && this.files[0]) {
        label.querySelector('span').textContent = this.files[0].name;
    }
});
</script>
{% endblock %}
