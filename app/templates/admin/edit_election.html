{% extends "base.html" %}

{% block title %}Edit Election{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">

    <!-- Top Breadcrumb & Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-400 font-medium mb-1">
                <a href="{{ url_for('admin.dashboard') }}" class="hover:text-emerald-500 transition">Command Center</a>
                <span>&gt;</span>
                <a href="{{ url_for('admin.manage_elections') }}" class="hover:text-emerald-500 transition">Manage Elections</a>
                <span>&gt;</span>
                <span>Edit Election</span>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Edit Election</h1>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">{{ election.title }}</p>
        </div>

        <div class="flex items-center gap-3 self-start sm:self-auto">
            <a href="{{ url_for('admin.manage_elections') }}" class="btn-vireo-secondary flex items-center gap-2 text-xs">
                <i class="fas fa-arrow-left text-slate-400"></i>
                <span>Back to Elections</span>
            </a>
        </div>
    </div>

    <!-- Form Container in Vireo Card -->
    <div class="vireo-card p-6 sm:p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label for="title" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Election Title</label>
                <input type="text" id="title" name="title" value="{{ election.title }}" required
                       class="w-full rounded-xl border border-slate-200 dark:border-[#1e283d] bg-white dark:bg-[#192238] px-4 py-2.5 text-xs sm:text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
            </div>

            <div>
                <label for="description" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Description</label>
                <textarea id="description" name="description" rows="3" required
                          class="w-full rounded-xl border border-slate-200 dark:border-[#1e283d] bg-white dark:bg-[#192238] px-4 py-2.5 text-xs sm:text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">{{ election.description }}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="p-4 rounded-2xl bg-slate-50/60 dark:bg-[#192238]/40 border border-slate-100 dark:border-[#1e283d] space-y-3">
                    <p class="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
                        <i class="fas fa-play text-emerald-500 text-[10px]"></i>
                        <span>Start Date &amp; Time</span>
                    </p>
                    <input type="date" id="start_date_date" name="start_date_date" value="{{ start_date }}" required
                           class="w-full rounded-xl border border-slate-200 dark:border-[#1e283d] bg-white dark:bg-[#131929] px-3.5 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                    <input type="time" id="start_date_time" name="start_date_time" value="{{ start_time }}" required
                           class="w-full rounded-xl border border-slate-200 dark:border-[#1e283d] bg-white dark:bg-[#131929] px-3.5 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                </div>

                <div class="p-4 rounded-2xl bg-slate-50/60 dark:bg-[#192238]/40 border border-slate-100 dark:border-[#1e283d] space-y-3">
                    <p class="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
                        <i class="fas fa-stop text-rose-400 text-[10px]"></i>
                        <span>End Date &amp; Time</span>
                    </p>
                    <input type="date" id="end_date_date" name="end_date_date" value="{{ end_date }}" required
                           class="w-full rounded-xl border border-slate-200 dark:border-[#1e283d] bg-white dark:bg-[#131929] px-3.5 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                    <input type="time" id="end_date_time" name="end_date_time" value="{{ end_time }}" required
                           class="w-full rounded-xl border border-slate-200 dark:border-[#1e283d] bg-white dark:bg-[#131929] px-3.5 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                </div>
            </div>

            <label class="flex items-center gap-3 cursor-pointer p-3 rounded-xl bg-slate-50/60 dark:bg-[#192238]/40 border border-slate-100 dark:border-[#1e283d]">
                <input type="checkbox" id="is_active" name="is_active" {% if election.is_active %}checked{% endif %}
                       class="w-4 h-4 rounded border-slate-300 dark:border-slate-700 text-emerald-500 focus:ring-emerald-500">
                <span class="text-xs font-bold text-slate-900 dark:text-white">Active Status</span>
                <span class="text-[11px] text-slate-400">&mdash; inactive elections cannot receive ballots</span>
            </label>

            <div class="flex flex-col sm:flex-row gap-3 pt-3 border-t border-slate-100 dark:border-[#1e283d]">
                <button type="submit" class="btn-vireo-primary flex-1 flex items-center justify-center gap-2 text-xs py-2.5">
                    <i class="fas fa-save"></i>
                    <span>Update Election</span>
                </button>
                <a href="{{ url_for('admin.manage_elections') }}" class="btn-vireo-secondary flex-1 text-center text-xs py-2.5">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>
{% endblock %}
