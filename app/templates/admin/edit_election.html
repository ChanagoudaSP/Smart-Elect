{% extends "base.html" %}

{% block title %}Edit Election{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="mb-6">
        <a href="{{ url_for('admin.manage_elections') }}" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
            <i class="fas fa-arrow-left mr-1"></i> Manage Elections
        </a>
        <h1 class="mt-1 text-3xl font-bold text-gray-900">Edit Election</h1>
        <p class="mt-1 text-sm text-gray-500">{{ election.title }}</p>
    </div>

    <div class="rounded-2xl bg-white shadow-sm border border-gray-100 p-6">
        <form method="POST" class="space-y-5">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Election Title</label>
                <input type="text" id="title" name="title" value="{{ election.title }}" required
                       class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea id="description" name="description" rows="3" required
                          class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">{{ election.description }}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div class="rounded-xl bg-gray-50 p-4">
                    <p class="text-sm font-medium text-gray-700 mb-3">
                        <i class="fas fa-play text-green-500 mr-1.5"></i> Start Date &amp; Time
                    </p>
                    <div class="space-y-3">
                        <input type="date" id="start_date_date" name="start_date_date" value="{{ start_date }}" required
                               class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        <input type="time" id="start_date_time" name="start_date_time" value="{{ start_time }}" required
                               class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="rounded-xl bg-gray-50 p-4">
                    <p class="text-sm font-medium text-gray-700 mb-3">
                        <i class="fas fa-stop text-red-400 mr-1.5"></i> End Date &amp; Time
                    </p>
                    <div class="space-y-3">
                        <input type="date" id="end_date_date" name="end_date_date" value="{{ end_date }}" required
                               class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        <input type="time" id="end_date_time" name="end_date_time" value="{{ end_time }}" required
                               class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>
                </div>
            </div>

            <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" id="is_active" name="is_active" {% if election.is_active %}checked{% endif %}
                       class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                <span class="text-sm font-medium text-gray-700">Active</span>
                <span class="text-xs text-gray-400">&mdash; inactive elections cannot receive votes</span>
            </label>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button type="submit"
                        class="flex-1 inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 shadow-md transition">
                    <i class="fas fa-save"></i> Update Election
                </button>
                <a href="{{ url_for('admin.manage_elections') }}"
                   class="flex-1 inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full text-sm font-semibold border border-gray-200 text-gray-700 hover:bg-gray-50 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>
{% endblock %}
