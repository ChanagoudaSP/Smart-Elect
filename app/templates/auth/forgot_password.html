{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-6">
        <div class="text-center">
            <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 flex items-center justify-center text-xl font-bold mx-auto mb-4">
                <i class="fas fa-key"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">Forgot password?</h2>
            <p class="mt-1 text-xs text-slate-400">Enter your registered email and we'll send you a recovery link</p>
        </div>

        <div class="vireo-card p-6 sm:p-8">
            <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-5">
                <div>
                    <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email address</label>
                    <input type="email" id="email" name="email" required
                           class="w-full rounded-xl border border-slate-200 dark:border-[#1e283d] bg-white dark:bg-[#192238] px-4 py-2.5 text-xs sm:text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                           placeholder="voter@smart-elect.com">
                </div>
                <button type="submit" class="btn-vireo-primary w-full py-2.5 text-xs flex items-center justify-center gap-2">
                    <i class="fas fa-paper-plane text-xs"></i>
                    <span>Send Reset Link</span>
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 dark:border-[#1e283d] text-center">
                <a href="{{ url_for('auth.login') }}" class="text-xs font-medium text-emerald-500 hover:text-emerald-400 flex items-center justify-center gap-1.5">
                    <i class="fas fa-arrow-left text-[10px]"></i>
                    <span>Back to Sign In</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
