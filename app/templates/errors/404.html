{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-16">
    <div class="vireo-card p-10 sm:p-14 text-center max-w-lg w-full">
        <p class="text-7xl font-extrabold font-mono text-emerald-500">404</p>
        <h1 class="mt-4 text-2xl font-extrabold text-slate-900 dark:text-white">Page Not Found</h1>
        <p class="mt-2 text-xs sm:text-sm text-slate-500 dark:text-slate-400 max-w-md mx-auto leading-relaxed">
            The resource you requested could not be located in the Smart-Elect routing directory.
        </p>
        <div class="mt-6 flex justify-center">
            <a href="{{ url_for('main.index') }}" class="btn-vireo-primary text-xs flex items-center gap-2">
                <i class="fas fa-home text-xs"></i>
                <span>Return to Home</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
