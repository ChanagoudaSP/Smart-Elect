{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-16">
    <div class="text-center">
        <p class="text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500">404</p>
        <h1 class="mt-4 text-2xl font-bold text-gray-900">Page Not Found</h1>
        <p class="mt-2 text-sm text-gray-500 max-w-md mx-auto">
            The page you are looking for does not exist or has been moved.
            Please check the URL or use the navigation menu to find what you need.
        </p>
        <a href="{{ url_for('main.index') }}"
           class="mt-6 inline-flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 shadow-md transition">
            <i class="fas fa-home"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}
